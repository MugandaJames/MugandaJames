name: Update README graphs

on:
  schedule:
    # Runs every 6 hours. Adjust as you like — cron is in UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-readme-graphs.yml"
      - "scripts/generate_readme_stats.py"

permissions:
  contents: write

jobs:
  update-graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs from live contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: MugandaJames
        run: python scripts/generate_readme_stats.py

      - name: Commit updated graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-assets/streak.svg profile-assets/activity-graph.svg
          git diff --quiet --cached || git commit -m "chore: refresh contribution graphs [skip ci]"
          git push
