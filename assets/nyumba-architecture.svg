<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="556" viewBox="0 0 1000 556" role="img" aria-label="Nyumba layered architecture: API, application, domain, repository interfaces, infrastructure, PostgreSQL. A request flows down the layers and the response flows back up.">
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{stroke-dasharray:4 8;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-24}}
  </style>
  <rect x="1" y="1" width="998" height="554" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="40" y="44" class="mono" font-size="13" fill="#a78bfa" letter-spacing="2">NYUMBA · LAYERED ARCHITECTURE</text>
  <text x="960" y="44" class="mono" font-size="12" fill="#6e7681" text-anchor="end">dependencies point inward ↓</text>
  <line x1="150" y1="99.0" x2="150" y2="479.0" stroke="#7c3aed" stroke-width="2" class="flow"/>
  <line x1="850" y1="479.0" x2="850" y2="99.0" stroke="#0891b2" stroke-width="2" class="flow"/>
  <text x="150" y="81.0" class="mono" font-size="12" fill="#c4b5fd" text-anchor="middle">request</text>
  <text x="850" y="81.0" class="mono" font-size="12" fill="#67e8f9" text-anchor="middle">response</text>
  
  <g>
    <rect x="200" y="70" width="600" height="58" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
