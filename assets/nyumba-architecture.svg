    <text x="780" y="485" class="mono" font-size="12" fill="#6e7681" text-anchor="end">L6</text>
  </g>
  <g>
    <circle r="7" fill="#c4b5fd"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="6.0s" repeatCount="indefinite"/>
      <animateMotion dur="6.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.5;1" calcMode="linear" path="M150 99.0 V479.0"/></circle>
    <circle r="7" fill="#67e8f9"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.5;.5;1" dur="6.0s" repeatCount="indefinite"/>
      <animateMotion dur="6.0s" repeatCount="indefinite" keyPoints="0;0;1" keyTimes="0;.5;1" calcMode="linear" path="M850 479.0 V99.0"/></circle>
  </g>
