    <rect x="200" y="374" width="600" height="58" rx="14" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;0;1;0;0" keyTimes="0.0000;0.4000;0.4833;0.6000;0.6833;1.0000" dur="6.0s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
