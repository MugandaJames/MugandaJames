    </rect>
    <circle cx="228" cy="251.0" r="6" fill="#c084fc"/>
    <text x="248" y="247" class="sans" font-size="17" font-weight="600" fill="#e6edf3">Domain</text>
    <text x="248" y="267" class="mono" font-size="12.5" fill="#8b949e">properties · tenants · leases · rent rules</text>
    <text x="780" y="257" class="mono" font-size="12" fill="#6e7681" text-anchor="end">L3</text>
  </g>
