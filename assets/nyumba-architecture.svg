    <text x="248" y="399" class="sans" font-size="17" font-weight="600" fill="#e6edf3">Infrastructure</text>
    <text x="248" y="419" class="mono" font-size="12.5" fill="#8b949e">SQLAlchemy · Alembic · M-Pesa adapter</text>
    <text x="780" y="409" class="mono" font-size="12" fill="#6e7681" text-anchor="end">L5</text>
  </g>
  <g>
    <rect x="200" y="450" width="600" height="58" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
