      <animate attributeName="opacity" values="1;0;0" keyTimes="0.0000;0.0833;1.0000" dur="6.0s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
    <circle cx="228" cy="99.0" r="6" fill="#a78bfa"/>
    <text x="248" y="95" class="sans" font-size="17" font-weight="600" fill="#e6edf3">API / Presentation</text>
    <text x="248" y="115" class="mono" font-size="12.5" fill="#8b949e">FastAPI routers · auth · validation</text>
    <text x="780" y="105" class="mono" font-size="12" fill="#6e7681" text-anchor="end">L1</text>
  </g>
  <g>
    <rect x="200" y="146" width="600" height="58" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="200" y="146" width="600" height="58" rx="14" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;0;1;0;0" keyTimes="0.0000;0.1000;0.1833;0.9000;0.9833;1.0000" dur="6.0s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
    <circle cx="228" cy="175.0" r="6" fill="#8b5cf6"/>
    <text x="248" y="171" class="sans" font-size="17" font-weight="600" fill="#e6edf3">Application</text>
    <text x="248" y="191" class="mono" font-size="12.5" fill="#8b949e">use cases · unit of work · RBAC</text>
    <text x="780" y="181" class="mono" font-size="12" fill="#6e7681" text-anchor="end">L2</text>
  </g>
  <g>
    <rect x="200" y="222" width="600" height="58" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="200" y="222" width="600" height="58" rx="14" fill="none" stroke="#c084fc" stroke-width="2" opacity="0">
