    </rect>
    <circle cx="228" cy="327.0" r="6" fill="#22d3ee"/>
    <text x="248" y="323" class="sans" font-size="17" font-weight="600" fill="#e6edf3">Repository interfaces</text>
    <text x="248" y="343" class="mono" font-size="12.5" fill="#8b949e">ports the domain depends on</text>
    <text x="780" y="333" class="mono" font-size="12" fill="#6e7681" text-anchor="end">L4</text>
  </g>
  <g>
