<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="James Juma Muganda — Backend Engineer, System Design, Infrastructure. Founder and CEO of WAONA.">
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .in{opacity:0;animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}
    .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}
    @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{from{transform:translateX(-220px)}to{transform:translateX(1220px)}}
    .flow{stroke-dasharray:6 10;animation:dash 1.6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-32}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
    .p2{animation-delay:.6s}.p3{animation-delay:1.2s}.p4{animation-delay:1.8s}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .node rect{fill:#161b22;stroke:#3d444d}
    .node text{fill:#e6edf3;font-size:13px}
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#30363d"/></pattern>
    <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="338" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0d1117"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect class="scan" x="0" y="0" width="200" height="340" fill="url(#beam)"/>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="none" stroke="#30363d" stroke-width="2"/>

  <g class="sans">
    <text class="in d1 mono" x="64" y="92" fill="#a78bfa" font-size="15" letter-spacing="3">HELLO, WORLD — I'M</text>
    <text class="in d2" x="62" y="152" fill="#ffffff" font-size="54" font-weight="700" letter-spacing="-1.5">James Juma Muganda</text>
    <text class="in d3" x="64" y="196" fill="#c9d1d9" font-size="22">Backend Engineer · System Design · Infrastructure</text>
    <g class="in d4">
      <rect x="64" y="226" width="318" height="38" rx="19" fill="#1f1530" stroke="#5b3f8c"/>
      <circle class="pulse" cx="86" cy="245" r="5" fill="#a78bfa"/>
      <text x="102" y="250" fill="#e2d5ff" font-size="15">Founder &amp; CEO, WAONA · Nairobi</text>
      <text class="mono" x="64" y="300" fill="#8b949e" font-size="14">$ building reliable systems<tspan class="caret" fill="#a78bfa">▍</tspan></text>
    </g>
  </g>

  <!-- live system diagram -->
  <g class="mono">
    <path id="a1" d="M820 120 H930" stroke="#7c3aed" stroke-width="2" fill="none" class="flow"/>
    <path id="a2" d="M1000 140 V196" stroke="#7c3aed" stroke-width="2" fill="none" class="flow"/>
    <path id="a3" d="M930 230 H820" stroke="#22d3ee" stroke-width="2" fill="none" class="flow"/>
    <path id="a4" d="M750 196 V140" stroke="#22d3ee" stroke-width="2" fill="none" class="flow"/>
    <path d="M1070 230 H1120" stroke="#3d444d" stroke-width="2" fill="none" class="flow"/>
    <circle r="4.5" fill="#c4b5fd"><animateMotion dur="1.8s" repeatCount="indefinite" path="M820 120 H930"/></circle>
    <circle r="4.5" fill="#c4b5fd"><animateMotion dur="1.8s" begin=".9s" repeatCount="indefinite" path="M1000 140 V196"/></circle>
    <circle r="4.5" fill="#67e8f9"><animateMotion dur="1.8s" begin=".45s" repeatCount="indefinite" path="M930 230 H820"/></circle>
    <circle r="4.5" fill="#67e8f9"><animateMotion dur="1.8s" begin="1.35s" repeatCount="indefinite" path="M750 196 V140"/></circle>
    <g class="node"><rect x="690" y="100" width="130" height="40" rx="10"/><text x="755" y="125" text-anchor="middle">client</text></g>
    <g class="node"><rect x="930" y="100" width="140" height="40" rx="10"/><text x="1000" y="125" text-anchor="middle">FastAPI</text></g>
    <g class="node"><rect x="930" y="196" width="140" height="40" rx="10"/><text x="1000" y="221" text-anchor="middle">PostgreSQL</text></g>
    <g class="node"><rect x="690" y="196" width="130" height="40" rx="10"/><text x="755" y="221" text-anchor="middle">200 OK</text></g>
    <circle class="pulse" cx="1132" cy="230" r="6" fill="#22d3ee"/>
    <circle class="pulse p2" cx="1080" cy="100" r="4" fill="#a78bfa"/>
    <circle class="pulse p3" cx="690" cy="100" r="4" fill="#a78bfa"/>
    <circle class="pulse p4" cx="690" cy="236" r="4" fill="#22d3ee"/>
    <text x="690" y="282" fill="#6e7681" font-size="12">request → validate → persist → respond</text>
  </g>
</svg>
