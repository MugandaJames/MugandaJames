<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="14" viewBox="0 0 1000 14" role="presentation" aria-hidden="true">
  <style>.run{animation:run 3.2s cubic-bezier(.45,0,.55,1) infinite}@keyframes run{from{transform:translateX(-160px)}to{transform:translateX(1000px)}}</style>
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>
  <rect x="0" y="6" width="1000" height="2" rx="1" fill="#30363d"/>
  <rect class="run" x="0" y="5" width="160" height="4" rx="2" fill="url(#g)"/>
</svg>
